<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mijn Leeromgeving</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 35px 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #10152b, #202b49);
    color: white;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

header h1 {
    font-size: clamp(28px, 5vw, 42px);
    margin-bottom: 10px;
}

header p {
    color: #b8c5df;
    font-size: 16px;
}

.dashboard {
    max-width: 1000px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
}

.tile {
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    text-decoration: none;
    color: white;
    box-shadow: 0 7px 18px rgba(0,0,0,0.2);
    transition: transform 0.25s ease,
                box-shadow 0.25s ease;
    overflow: hidden;
}

.tile:hover {
    transform: translateY(-7px) scale(1.02);
    box-shadow: 0 15px 30px rgba(0,0,0,0.35);
}

.icon {
    font-size: clamp(35px, 7vw, 55px);
}

.tile h2 {
    font-size: clamp(15px, 2.5vw, 21px);
    margin: 0;
}

/* Kleurrijke gradients */

.purple {
    background: linear-gradient(135deg,#6246EA,#A855F7);
}

.blue {
    background: linear-gradient(135deg,#087E8B,#06B6D4);
}

.orange {
    background: linear-gradient(135deg,#E76F51,#F4A261);
}

.green {
    background: linear-gradient(135deg,#168B65,#52B788);
}

.pink {
    background: linear-gradient(135deg,#B34BC2,#EC4899);
}

.red {
    background: linear-gradient(135deg,#C44569,#F97373);
}

.cyan {
    background: linear-gradient(135deg,#2563EB,#38BDF8);
}

.yellow {
    background: linear-gradient(135deg,#CA8A04,#F59E0B);
}

.violet {
    background: linear-gradient(135deg,#5265C9,#818CF8);
}

.teal {
    background: linear-gradient(135deg,#0D9488,#2DD4BF);
}

.rose {
    background: linear-gradient(135deg,#DB7048,#FB923C);
}

.indigo {
    background: linear-gradient(135deg,#4338CA,#818CF8);
}

footer {
    text-align: center;
    margin-top: 40px;
    color: #94a3b8;
    font-size: 13px;
}

/* Tablet en desktop */

@media (min-width: 600px) {
    .dashboard {
        grid-template-columns: repeat(4, 1fr);
    }
}

@media (min-width: 950px) {
    .dashboard {
        grid-template-columns: repeat(4, 1fr);
    }
}

</style>
</head>

<body>

<header>
    <h1>📚 Mijn Leeromgeving</h1>
    <p>Ontdek, oefen en leer!</p>
</header>

<main class="dashboard">

    <a href="oefentoetsen/" class="tile purple">
        <span class="icon">📚</span>
        <h2>Oefentoetsen</h2>
    </a>

    <a href="grammatica/" class="tile blue">
        <span class="icon">✍️</span>
        <h2>Grammatica</h2>
    </a>

    <a href="lezen/" class="tile orange">
        <span class="icon">📖</span>
        <h2>Lezen</h2>
    </a>

    <a href="luisteren/" class="tile green">
        <span class="icon">🎧</span>
        <h2>Luisteren</h2>
    </a>

    <a href="schrijven/" class="tile pink">
        <span class="icon">📝</span>
        <h2>Schrijven</h2>
    </a>

    <a href="spreken/" class="tile red">
        <span class="icon">🗣️</span>
        <h2>Spreken</h2>
    </a>

    <a href="spelletjes/" class="tile cyan">
        <span class="icon">🎮</span>
        <h2>Spelletjes</h2>
    </a>

    <a href="examens/" class="tile yellow">
        <span class="icon">🎓</span>
        <h2>Examens</h2>
    </a>

</main>

<footer>
    © 2026 Mijn Leeromgeving
</footer>

</body>
</html>
