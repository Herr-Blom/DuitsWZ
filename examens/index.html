<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Examens - Mijn Leeromgeving</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 35px 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #10152b, #202b49);
    color: white;
}

header {
    text-align: center;
    margin-bottom: 35px;
}

header h1 {
    font-size: clamp(28px, 5vw, 42px);
    margin-bottom: 10px;
}

header p {
    color: #b8c5df;
    font-size: 16px;
}

/* Terug-knop styling */
.back-btn {
    display: inline-block;
    margin-bottom: 20px;
    color: #b8c5df;
    text-decoration: none;
    font-size: 15px;
    transition: color 0.2s;
}

.back-btn:hover {
    color: white;
}

.dashboard {
    max-width: 800px;
    margin: auto;
    display: grid;
    grid-template-columns: 1fr; /* 1 kolom op mobiel */
    gap: 18px;
}

.tile {
    border-radius: 22px;
    padding: 25px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-decoration: none;
    color: white;
    box-shadow: 0 7px 18px rgba(0,0,0,0.2);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.tile:hover {
    transform: translateY(-5px) scale(1.01);
    box-shadow: 0 15px 30px rgba(0,0,0,0.35);
}

.tile h2 {
    font-size: clamp(18px, 3vw, 24px);
    margin: 0 0 5px 0;
}

.tile p {
    margin: 0;
    color: rgba(255, 255, 255, 0.8);
    font-size: 14px;
}

/* Kleuren voor de tijdvakken */
.yellow { background: linear-gradient(135deg,#CA8A04,#F59E0B); }
.orange { background: linear-gradient(135deg,#E76F51,#F4A261); }

/* Tablet en desktop: 2 kolommen naast elkaar */
@media (min-width: 600px) {
    .dashboard {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <a href="../index.html" class="back-btn">← Terug naar dashboard</a>
    <h1>🎓 Examens</h1>
    <p>Kies een examen om te oefenen</p>
</header>

<main class="dashboard">

    <!-- Link naar Tijdvak 1 -->
    <a href="Examen-vmbo-gl-tl-2026-tijdvak-1/" class="tile yellow">
        <h2>Examen VMBO GL/TL 2026</h2>
        <p>Tijdvak 1</p>
    </a>

    <!-- Link naar Tijdvak 2 -->
    <a href="Examen-vmbo-gl-tl-2026-tijdvak-2/" class="tile orange">
        <h2>Examen VMBO GL/TL 2026</h2>
        <p>Tijdvak 2</p>
    </a>

</main>

</body>
</html>
