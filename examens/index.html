<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    padding: 35px 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #10152b, #202b49);
    color: white;
}
header { text-align: center; margin-bottom: 30px; }
header h1 { font-size: clamp(28px, 5vw, 42px); margin-bottom: 10px; }
header p { color: #b8c5df; font-size: 16px; }

.list-container {
    max-width: 700px;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
}

.list-item {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    padding: 22px 24px;
    border-radius: 14px;
    text-decoration: none;
    color: white;
    font-size: clamp(16px, 2.5vw, 18px);
    border: none;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.3);
}
.list-item strong { font-size: clamp(17px, 2.6vw, 19px); }
.list-item span {
    color: rgba(255,255,255,0.85);
    font-size: 14px;
    transition: color 0.2s;
}
.list-item:hover {
    transform: translateY(-4px);
}
.list-item:hover span { color: white; }

.list-item::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(to bottom, rgba(255,255,255,0.18), transparent);
    pointer-events: none;
}
